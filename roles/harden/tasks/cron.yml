---

- name: Ensure cron directory permissions are correct
  become: true
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/cron.d
    - /etc/cron.daily
    - /etc/cron.hourly
    - /etc/cron.monthly
    - /etc/cron.weekly
    - /etc/cron.yearly

- name: Ensure cron allow files are present
  become: true
  ansible.builtin.copy:
    content: ' '
    dest: "{{ item }}"
    mode: '0640'
    owner: root
    group: root
  loop:
    - /etc/at.allow
    - /etc/cron.allow
    
- name: Ensure cron deny files are missing
  become: true
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/at.deny
    - /etc/cron.deny
